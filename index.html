<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta
            name="viewport"
            content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover"
        />

        <meta name="theme-color" content="#111827" />

        <title>Mobile UI Framework</title>

        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <div id="productionErrorLog"></div>

        <div id="devtools"></div>

        <div id="app">
            <header id="app-header">
                <div class="brand">
                    <div class="brand-icon">UI</div>

                    <div class="brand-text">
                        <h1>Mobile UI</h1>
                        <p>Framework Workspace</p>
                    </div>
                </div>

                <div class="renderer-status">
                    <span class="status-dot"></span>
                    DOM Renderer
                </div>
            </header>

            <main id="main">
                <section class="workspace">
                    <div class="workspace-heading">
                        <div>
                            <p class="eyebrow">YOUR PROJECT</p>
                            <h2>Workspace</h2>
                        </div>

                        <span class="workspace-tag">Development</span>
                    </div>

                    <div id="workspace-content">
                        <!-- Workspace content is rendered by main.js. -->
                    </div>
                </section>
            </main>

            <footer id="app-footer">
                <span>Mobile UI Framework</span>
                <span id="app-version">Prototype 0.1</span>
            </footer>
        </div>

        <!-- Install error listeners first. -->
        <script src="../mobile-dev-console/errorBootstrap.js"></script>

        <!-- Initialize the console before integrations and the application. -->
        <script type="module">
            try {
                const { default: DevTools } =
                    await import("../mobile-dev-console/DevTools.js");

                const { DebugButtons } =
                    await import("./debug/DebugButtons.js");

                /*
                const devTools = DevTools.mount({
                    mode: "overlay",
                    captureConsole: true,
                    mirrorToNative: false,
                    showCopyButtons: false,
                    allowDragOutsideBounds: true
                });
                */

                const devTools = DevTools.mount({
                    
                    mode: "embedded",
                    mountPoint: "#devtools", // set above
                    height: "60dvh",
                    captureConsole: true,
                    mirrorToNative: false,
                    showCopyButtons: false,
                    allowDragOutsideBounds: true
                });

                DebugButtons.connect(devTools);

                /*devTools.registerSuite({
                    id: "app-debug",
                    name: "App Debug Tools",

                    actions: [
                        {
                            id: "hello",
                            label: "Test Button",

                            run({ console }) {
                                console.log("Button clicked!");
                            }
                        },
                        {
                            id: "log test",
                            label: "LOG",

                            run() {
                                console.log(arrayTest);
                            }
                        }
                        
                    ]
                });*/

                // Optional: make the instance available to app code.
                // window.ksimDevTools = devTools;

                await import("./main.js");
            } catch (error) {
                if (window.ksimDevTools?.devConsole) {
                    window.ksimDevTools.devConsole.error(error);
                } else if (window.devConsole) {
                    window.devConsole.error(error);
                } else if (window.showFatalError) {
                    window.showFatalError("Application Startup Failed", error);
                } else {
                    console.error(error);
                }
            }
        </script>
    </body>
</html>
