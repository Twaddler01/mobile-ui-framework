<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#10141d" />

        <title>Mobile UI Framework — Navigation Demo</title>

        <!-- optional css -->
        <link rel="stylesheet" href="../src/navigation/screen-host.css" />

        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #10141d;
                color: #f1f5f9;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                background: #10141d;
            }

            button {
                font: inherit;
                -webkit-tap-highlight-color: transparent;
            }

            .app {
                display: flex;
                flex-direction: column;
                min-height: 100dvh;
                padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
            }

            .app-header {
                padding: 20px 22px 16px;
                border-bottom: 1px solid #283141;
            }

            .app-brand {
                margin: 0;
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.14em;
                color: #66e3c4;
                text-transform: uppercase;
            }

            .app-subtitle {
                margin: 5px 0 0;
                color: #9ca9bb;
                font-size: 13px;
            }

            #screen-host {
                flex: 1;
                display: flex;
                min-height: 0;
                /*padding: 22px;*/
            }

            .demo-screen {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
                gap: 16px;
                padding: 22px;
            }

            .screen-eyebrow {
                margin: 0;
                color: #66e3c4;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .screen-title {
                margin: 0;
                font-size: clamp(28px, 8vw, 38px);
                line-height: 1.15;
                letter-spacing: -0.04em;
            }

            .screen-description {
                margin: 0;
                color: #aab5c5;
                font-size: 15px;
                line-height: 1.65;
            }

            .demo-card {
                width: 100%;
                padding: 20px;
                border: 1px solid #303b4e;
                border-radius: 18px;
                background: #191f2b;
            }

            .demo-card h2 {
                margin: 0 0 8px;
                font-size: 17px;
            }

            .demo-card p {
                margin: 0;
                color: #aab5c5;
                font-size: 14px;
                line-height: 1.6;
            }

            .demo-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 48px;
                padding: 12px 18px;
                border: 0;
                border-radius: 13px;
                background: #66e3c4;
                color: #10201e;
                font-weight: 750;
                cursor: pointer;
            }

            .demo-button:active {
                transform: scale(0.98);
            }

            .demo-button:focus-visible,
            .tab-bar__button:focus-visible {
                outline: 2px solid #ffffff;
                outline-offset: 3px;
            }

            .secondary-button {
                background: #293446;
                color: #f1f5f9;
            }

            .demo-status {
                color: #9ca9bb;
                font-size: 13px;
            }

            #tab-bar-host {
                position: sticky;
                bottom: 0;
                z-index: 10;
                padding-bottom: 0;
                border-top: 1px solid #303b4e;
                background: #171d28;
            }

            .tab-bar {
                display: flex;
                width: 100%;
                min-height: 76px;
                padding: 8px 8px 4px;
                gap: 4px;
            }

            .tab-bar__button {
                display: flex;
                flex: 1;
                min-width: 0;
                min-height: 58px;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                border: 0;
                border-radius: 13px;
                background: transparent;
                color: #9ca9bb;
                cursor: pointer;
            }

            .tab-bar__button.is-selected {
                background: #263a3b;
                color: #66e3c4;
            }

            .tab-bar__icon {
                font-size: 21px;
                line-height: 1;
            }

            .tab-bar__label {
                font-size: 11px;
                font-weight: 650;
            }

            .app-footer {
                padding: 10px 16px;
                border-top: 1px solid #283141;
                color: #7f8ca0;
                font-size: 11px;
                text-align: center;
            }

            .app-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 20px 22px 16px;
                border-bottom: 1px solid #283141;
            }

            .app-header__center {
                flex: 1;
                min-width: 0;
                text-align: center;
            }

            .nav-arrow {
                display: inline-flex;
                align-items: center;
                justify-content: center;

                width: 40px;
                height: 40px;
                flex-shrink: 0;

                border: 1px solid #303b4e;
                border-radius: 10px;
                background: #191f2b;
                color: #f1f5f9;

                font-size: 20px;
                line-height: 1;
                cursor: pointer;

                /* Hidden until the attribute flips it visible.
       visibility, not display, keeps the header layout stable
       and removes pointer interaction in one property. */
                visibility: hidden;
            }

            .nav-arrow:active {
                transform: scale(0.96);
            }

            .nav-arrow:focus-visible {
                outline: 2px solid #ffffff;
                outline-offset: 3px;
            }

            /* :has() reaches from the header's parent to the attribute
   that ScreenHost sets on #screen-host. Supported in all
   modern browsers (Firefox 121+, Safari 15.4+, Chrome 105+). */
            .app:has(#screen-host[data-can-go-back="true"]) .nav-back,
            .app:has(#screen-host[data-can-go-forward="true"]) .nav-forward {
                visibility: visible;
            }

            #demo-error {
                display: none;
                margin: 16px;
                padding: 14px;
                border: 1px solid #a94452;
                border-radius: 12px;
                color: #ffb7c0;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
        </style>

        <script type="module" src="../src/debug/console-loader.js"></script>
    </head>

    <body>
        <div class="app">
            <header class="app-header">
                <button
                    class="nav-arrow nav-back"
                    type="button"
                    aria-label="Back"
                >
                    <span aria-hidden="true">←</span>
                </button>

                <div class="app-header__center">
                    <p class="app-brand">Mobile UI Framework</p>
                    <p class="app-subtitle">
                        Navigation integration playground
                    </p>
                </div>

                <button
                    class="nav-arrow nav-forward"
                    type="button"
                    aria-label="Forward"
                >
                    <span aria-hidden="true">→</span>
                </button>
            </header>

            <main id="screen-host"></main>

            <div id="tab-bar-host"></div>

            <footer class="app-footer">
                ScreenHost + TabBar + TabNavigator
            </footer>

            <pre id="demo-error"></pre>
        </div>

        <script type="module">
            import {
                Text,
                Button,
                Card,
                Html,
                Screen,
                ScreenRegistry,
                TabNavigator,
                ScreenHost,
                TabBar,
                HistorySync,
                SwipeNavigation
            } from "../src/ui.js";

            const errorBox = document.querySelector("#demo-error");

            function showError(error) {
                errorBox.style.display = "block";
                errorBox.textContent = error?.stack ?? String(error);
                console.error(error);
            }

            function mountApp(
                navigator,
                {
                    host,
                    tabBar,
                    transition = { duration: 200 },
                    history = false,
                    swipe = false,
                    arrows = null
                }
            ) {
                const hostEl =
                    typeof host === "string"
                        ? document.querySelector(host)
                        : host;
                if (!hostEl)
                    throw new Error(`mountApp: no element for "${host}"`);

                // ScreenHost first — otherwise deep-link restores flash the
                // initial screen before flipping to the restored one.
                const screenHost = new ScreenHost(navigator, { transition });
                screenHost.mount(hostEl);

                const swipeInstance = swipe
                    ? new SwipeNavigation(navigator).mount(hostEl)
                    : null;

                const tabBarEl = tabBar
                    ? typeof tabBar === "string"
                        ? document.querySelector(tabBar)
                        : tabBar
                    : null;
                const tabBarInstance = tabBarEl
                    ? new TabBar(navigator).mount(tabBarEl)
                    : null;

                const historyInstance = history
                    ? new HistorySync(navigator, history).start()
                    : null;

                if (arrows) {
                    document
                        .querySelector(arrows.back)
                        ?.addEventListener("click", () => navigator.back());
                    document
                        .querySelector(arrows.forward)
                        ?.addEventListener("click", () => navigator.forward());
                }

                return {
                    screenHost,
                    tabBar: tabBarInstance,
                    swipe: swipeInstance,
                    history: historyInstance
                };
            }

            try {
                let navigator;

                const registry = new ScreenRegistry({
                    Home: Screen(() =>
                        Html.section({ className: "demo-screen" }, [
                            Text("Welcome", { className: "screen-eyebrow" }),
                            Text("Your home.", {
                                tagName: "h1",
                                className: "screen-title"
                            }),
                            Text(
                                "This screen belongs to the Home tab. Open Details to test stack navigation.",
                                { className: "screen-description" }
                            ),
                            Card({
                                className: "demo-card",
                                heading: "Independent screens",
                                description:
                                    "The screen area updates independently of the bottom tab bar."
                            }),
                            Button("Open Details →", {
                                className: "demo-button",
                                onClick: () => navigator.navigate("Details")
                            })
                        ])
                    ),

                    Details: Screen(() =>
                        Html.section({ className: "demo-screen" }, [
                            Text("Stack navigation", {
                                className: "screen-eyebrow"
                            }),
                            Text("Details", {
                                tagName: "h1",
                                className: "screen-title"
                            }),
                            Text(
                                "This screen was pushed onto the Home tab's navigation stack.",
                                { className: "screen-description" }
                            ),
                            Card({
                                className: "demo-card",
                                heading: "Try Back",
                                description:
                                    "Returning should reveal the Home screen without rebuilding the tab bar."
                            }),
                            Button("← Back to Home", {
                                className: "demo-button secondary-button",
                                onClick: () => navigator.back()
                            })
                        ])
                    ),

                    Search: Screen(() =>
                        Html.section({ className: "demo-screen" }, [
                            Text("Scroll demo", {
                                className: "screen-eyebrow"
                            }),
                            Text("Long list", {
                                tagName: "h1",
                                className: "screen-title"
                            }),
                            Text(
                                "Scroll down to around item 15, then tap Back. Return to this screen — you should land back at item 15.",
                                { className: "screen-description" }
                            ),
                            ...Array.from({ length: 25 }, (_, i) =>
                                Card({
                                    className: "demo-card",
                                    heading: `Item ${i + 1}`,
                                    description:
                                        "Scroll position should survive leaving and returning."
                                })
                            ),
                            Button("← Home tab", {
                                className: "demo-button secondary-button",
                                onClick: () => navigator.selectTab("home")
                            })
                        ])
                    ),

                    Settings: Screen(() =>
                        Html.section({ className: "demo-screen" }, [
                            Text("Preferences", {
                                className: "screen-eyebrow"
                            }),
                            Text("Settings", {
                                tagName: "h1",
                                className: "screen-title"
                            }),
                            Text("This is another independent tab.", {
                                className: "screen-description"
                            }),
                            Card({
                                className: "demo-card",
                                heading: "Navigation state",
                                description:
                                    "Changing tabs should not remove the tab bar or reset other tabs' stacks."
                            }),
                            Button("Return to Home tab", {
                                className: "demo-button secondary-button",
                                onClick: () => navigator.selectTab("home")
                            })
                        ])
                    )
                });

                navigator = new TabNavigator(registry, [
                    { id: "home", label: "Home", icon: "⌂", screen: "Home" },
                    {
                        id: "search",
                        label: "Search",
                        icon: "⌕",
                        screen: "Search"
                    },
                    {
                        id: "settings",
                        label: "Settings",
                        icon: "⚙",
                        screen: "Settings"
                    }
                ]);

                const app = mountApp(navigator, {
                    host: "#screen-host",
                    tabBar: "#tab-bar-host",
                    transition: { duration: 200 },
                    history: { mode: "hash" },
                    swipe: true,
                    arrows: {
                        back: ".nav-back",
                        forward: ".nav-forward"
                    }
                });

                window.demo = { navigator, ...app };

                console.info(
                    "Navigation demo ready.",
                    "Try demo.navigator.navigate('Details')"
                );
            } catch (error) {
                showError(error);
            }
        </script>
    </body>
</html>
